<!DOCTYPE html>
<html lang="it">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Photo Booth - Laurea Nicola</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
  background: #111;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  min-height: 100dvh; /* Adatta perfettamente l'altezza ignorando la barra dinamica di Safari/Chrome */
  overflow-y: auto;   /* Permette lo scroll se lo schermo è troppo compatto */
  padding: 10px 0;
  }
    #capture-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #camera-container {
      position: relative;
      width: 90vw;
      max-width: 420px;
      aspect-ratio: 3 / 4;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    video {
      position: absolute;
      top: 4%;
      left: 12%;
      width: 76%;
      height: 60%;
      object-fit: cover;
      border-radius: 20px 20px 0 0;
    }
    video.mirror {
      transform: scaleX(-1);
      -webkit-transform: scaleX(-1);
    }
    #frame-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      object-fit: fill;
      z-index: 2;
    }
    #controls {
      margin-top: 15px;
      display: flex;
      gap: 15px;
      align-items: center;
    }
    .btn {
      background: #d32f2f;
      color: #fff;
      border: none;
      padding: 10px 18px; /* Era 12px 22px */
      font-size: 14px;    /* Era 15px */
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn-secondary { background: #333; }
    .btn-cloud { background: #0070f3; }
    .btn-success { background: #2e7d32; }
    #result-container {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    max-height: 98dvh;
    }
    #photo-result {
      width: 85vw;
      max-width: 360px;
      max-height: 52vh;   /* Impedisce alla foto di rubare tutta l'altezza verticale */
      object-fit: contain;
      border-radius: 12px;
    }
    #status-msg {
      font-size: 14px;
      text-align: center;
      min-height: 20px;
      color: #aaa;
    }
    canvas { display: none; }
  </style>
</head>
<body>

  <div id="capture-ui">
    <div id="camera-container">
      <video id="video" class="mirror" autoplay playsinline muted></video>
      <img id="frame-overlay" src="cornice.png" alt="Cornice Fiat 500">
    </div>
    <div id="controls">
      <button class="btn btn-secondary" id="switch-btn">🔄 Gira Cam</button>
      <button class="btn" id="snap-btn">📸 Scatta</button>
    </div>
  </div>

  <div id="result-container">
    <img id="photo-result" alt="Foto scattata">
    <div id="status-msg"></div>
    <div style="display:flex; flex-direction:column; gap:8px; width: 85vw; max-width: 400px;">
      <button id="upload-btn" class="btn btn-cloud">🚀 Invia alla TV</button>
      <a id="download-link" class="btn btn-success" download="laurea_nicola.jpg">💾 Salva nel rullino</a>
      <button class="btn btn-secondary" id="retake-btn">Scatta un'altra</button>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const CLOUD_NAME = "jyu2ze15";
    const UPLOAD_PRESET = "laurea_booth";
    const REALTIME_TOPIC = "booth-live-8f4b29c1e07d3a";

    const video = document.getElementById('video');
    const frame = document.getElementById('frame-overlay');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snap-btn');
    const switchBtn = document.getElementById('switch-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const captureUI = document.getElementById('capture-ui');
    const resultContainer = document.getElementById('result-container');
    const photoResult = document.getElementById('photo-result');
    const downloadLink = document.getElementById('download-link');
    const uploadBtn = document.getElementById('upload-btn');
    const statusMsg = document.getElementById('status-msg');

    let currentFacingMode = "user";
    let currentStream = null;
    let currentDataURL = null;

    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      if (currentFacingMode === "user") {
        video.classList.add("mirror");
      } else {
        video.classList.remove("mirror");
      }

      const constraints = {
        audio: false,
        video: {
          facingMode: { ideal: currentFacingMode },
          width: { ideal: 1280 },
          height: { ideal: 960 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        await video.play();
      } catch (err) {
        try {
          currentStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: currentFacingMode }
          });
          video.srcObject = currentStream;
          await video.play();
        } catch (fallbackErr) {
          alert("Errore nell'avvio della fotocamera.");
        }
      }
    }

    switchBtn.addEventListener('click', () => {
      currentFacingMode = currentFacingMode === "user" ? "environment" : "user";
      initCamera();
    });

    snapBtn.addEventListener('click', () => {
      const targetW = frame.naturalWidth || 1080;
      const targetH = frame.naturalHeight || 1440;

      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');

      const winX = targetW * 0.12;
      const winY = targetH * 0.04;
      const winW = targetW * 0.76;
      const winH = targetH * 0.60;

      const vW = video.videoWidth || targetW;
      const vH = video.videoHeight || targetH;
      const boxRatio = winW / winH;
      const videoRatio = vW / vH;

      let sW, sH, sx, sy;

      if (videoRatio > boxRatio) {
        sH = vH;
        sW = vH * boxRatio;
        sx = (vW - sW) / 2;
        sy = 0;
      } else {
        sW = vW;
        sH = vW / boxRatio;
        sx = 0;
        sy = (vH - sH) / 2;
      }

      ctx.save();
      if (currentFacingMode === "user") {
        ctx.translate(winX + winW, winY);
        ctx.scale(-1, 1);
        ctx.drawImage(video, sx, sy, sW, sH, 0, 0, winW, winH);
      } else {
        ctx.drawImage(video, sx, sy, sW, sH, winX, winY, winW, winH);
      }
      ctx.restore();

      ctx.drawImage(frame, 0, 0, targetW, targetH);

      currentDataURL = canvas.toDataURL('image/jpeg', 0.95);
      photoResult.src = currentDataURL;
      downloadLink.href = currentDataURL;

      uploadBtn.disabled = false;
      uploadBtn.innerText = "🚀 Invia alla TV";
      uploadBtn.style.background = "#0070f3";
      statusMsg.innerText = "";

      captureUI.style.display = "none";
      resultContainer.style.display = "flex";
    });

    uploadBtn.addEventListener('click', async () => {
      if (!currentDataURL) return;

      uploadBtn.disabled = true;
      uploadBtn.innerText = "⏳ Invio in corso...";
      statusMsg.innerText = "Caricamento sullo schermo...";

      const formData = new FormData();
      formData.append("file", currentDataURL);
      formData.append("upload_preset", UPLOAD_PRESET);
      formData.append("tags", "laurea_nicola");

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData
        });
        
        if (res.ok) {
          const resData = await res.json();
          const photoUrl = resData.secure_url;

          // Notifica istantanea alla TV via SSE con cancellazione traccia immediata
          try {
            await fetch(`https://ntfy.sh/${REALTIME_TOPIC}`, {
              method: 'POST',
              headers: {
                'X-Cache': 'no'
              },
              body: photoUrl
            });
          } catch(e) {
            console.log("Errore realtime, passerà dal ciclo ordinario");
          }

          uploadBtn.innerText = "✅ Inviata alla TV!";
          uploadBtn.style.background = "#2e7d32";
          statusMsg.innerText = "Foto proiettata con successo!";
        } else {
          throw new Error("Errore durante l'invio");
        }
      } catch (err) {
        uploadBtn.disabled = false;
        uploadBtn.innerText = "❌ Riprova invio";
        uploadBtn.style.background = "#d32f2f";
        statusMsg.innerText = "Errore di connessione. Riprova!";
      }
    });

    retakeBtn.addEventListener('click', () => {
      resultContainer.style.display = "none";
      captureUI.style.display = "flex";
    });

    initCamera();
  </script>
</body>
</html>
