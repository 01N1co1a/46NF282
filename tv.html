<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Slideshow TV - Laurea Nicola</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #slide {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 14px;
      box-shadow: 0 0 60px rgba(255,255,255,0.12);
      transition: opacity 0.5s ease-in-out;
      opacity: 0;
    }
    #placeholder {
      font-size: 26px;
      color: #777;
      text-align: center;
    }
    #new-badge {
      position: absolute;
      top: 30px;
      right: 30px;
      background: #d32f2f;
      color: white;
      padding: 12px 24px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      display: none;
      z-index: 10;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div id="new-badge">✨ Nuovo Scatto!</div>
  <div id="placeholder">In attesa del primo scatto sulla 500... 🚗💨</div>
  <img id="slide" alt="Foto Live">

  <script>
    const CLOUD_NAME = "jyu2ze15";
    const TAG = "laurea_nicola";
    const REALTIME_TOPIC = "booth-live-8f4b29c1e07d3a";

    const slideImg = document.getElementById('slide');
    const placeholder = document.getElementById('placeholder');
    const newBadge = document.getElementById('new-badge');

    let photos = [];
    let currentIndex = 0;
    let isShowingNewPhoto = false;

    // Ricezione istantanea via WebSocket/SSE
    function setupRealtimeListener() {
      const eventSource = new EventSource(`https://ntfy.sh/${REALTIME_TOPIC}/sse`);
      
      eventSource.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.event === "message" && data.message && data.message.startsWith("http")) {
            const incomingPhotoUrl = data.message;
            if (!photos.includes(incomingPhotoUrl)) {
              photos.unshift(incomingPhotoUrl);
            }
            showImmediate(incomingPhotoUrl);
          }
        } catch(e) {
          console.error(e);
        }
      };

      eventSource.onerror = () => {
        setTimeout(setupRealtimeListener, 5000);
      };
    }

    // Caricamento storico per lo slideshow generale di sottofondo
    async function fetchArchivePhotos() {
      try {
        const url = `https://res.cloudinary.com/${CLOUD_NAME}/image/list/${TAG}.json?ts=${Date.now()}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data.resources && data.resources.length > 0) {
            data.resources.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const loaded = data.resources.map(r => 
              `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/q_auto,f_auto/v${r.version}/${r.public_id}.${r.format}`
            );
            
            loaded.forEach(u => {
              if (!photos.includes(u)) photos.push(u);
            });

            if (slideImg.style.opacity == 0 && photos.length > 0 && !isShowingNewPhoto) {
              showNext();
            }
          }
        }
      } catch (e) {}
    }

    function showImmediate(url) {
      isShowingNewPhoto = true;
      newBadge.style.display = "block";
      slideImg.style.opacity = 0;

      setTimeout(() => {
        placeholder.style.display = "none";
        slideImg.src = url;
        slideImg.onload = () => {
          slideImg.style.opacity = 1;
        };

        // Tiene a schermo il nuovo arrivato per 8 secondi
        setTimeout(() => {
          newBadge.style.display = "none";
          isShowingNewPhoto = false;
        }, 8000);
      }, 400);
    }

    function showNext() {
      if (photos.length === 0 || isShowingNewPhoto) return;
      placeholder.style.display = "none";

      slideImg.style.opacity = 0;
      setTimeout(() => {
        slideImg.src = photos[currentIndex];
        slideImg.onload = () => {
          slideImg.style.opacity = 1;
        };
        currentIndex = (currentIndex + 1) % photos.length;
      }, 500);
    }

    setupRealtimeListener();
    fetchArchivePhotos();
    setInterval(fetchArchivePhotos, 30000);
    setInterval(showNext, 6000);
  </script>
</body>
</html>
